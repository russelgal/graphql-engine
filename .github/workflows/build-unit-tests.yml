name: build and unit tests
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev unixodbc-dev libkrb5-dev libssl-dev zlib1g-dev libgmp-dev liblzma-dev libnuma-dev pkg-config

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.14.1'
          cabal-version: latest

      - name: Configure
        run: |
          echo 12345 > server/CURRENT_VERSION
          cabal update
          cabal build graphql-engine:test:graphql-engine-tests -O0 --dry-run

      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: store-${{ hashFiles('cabal.project.freeze') }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: store-${{ hashFiles('cabal.project.freeze') }}-

      - name: Dependencies
        run: cabal build graphql-engine:test:graphql-engine-tests -O0 --only-dependencies

      - uses: actions/cache/save@v4
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: store-${{ hashFiles('cabal.project.freeze') }}-${{ hashFiles('dist-newstyle/cache/plan.json') }}

      - name: Build
        run: cabal build graphql-engine:test:graphql-engine-tests -O0

      - name: Aggregation predicates unit tests
        run: cabal run graphql-engine:test:graphql-engine-tests -O0 -- --match "Aggregation Predicates"

      - name: All unit tests
        run: cabal run graphql-engine:test:graphql-engine-tests -O0
